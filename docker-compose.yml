services:
  hideseek-atlas:
    build:
      context: .
    image: hideseek-atlas:local
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      HOST: 0.0.0.0
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      DATA_DIR: /data
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      OVERPASS_URL: ${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      OSM_TILE_URL: ${OSM_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      OSM_TILE_ATTRIBUTION: ${OSM_TILE_ATTRIBUTION:-&copy; OpenStreetMap contributors}
      MAX_KML_BYTES: ${MAX_KML_BYTES:-5242880}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - hideseek_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  hideseek_data:
